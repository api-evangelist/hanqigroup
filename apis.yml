description: >-
  Beijing Hanqi Environmental Technology Co., Ltd. (Hanqi Group) is a Beijing-based
  environmental technology company specializing in full-process chemical and oily
  wastewater treatment for the petrochemical, coal-chemical, new-energy, industrial-park,
  and municipal sectors. With roughly 17 years of operating history, 140+ client
  references, and 80+ patents across physicochemical, biochemical, and oxidation
  process categories, Hanqi delivers engineered water-treatment technologies and
  services rather than software. It was surfaced as a portfolio company of Qiming
  Venture Partners and added to the API Evangelist network. Public research confirms
  no developer, API, SDK, or agent surface exists for this provider.
